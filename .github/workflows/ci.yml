name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
      release_tag:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Package on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:distribution
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'release' && github.event.release.tag_name) || '' }}
      - run: npm run build
      - name: Test cross-platform startup and input snapshots
        run: node --test test/bootstrap.test.mjs test/snapshots.test.mjs
      - name: Test operations and MCP
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm test
      - name: Test tarball with fresh npx and offline cached startup
        run: npm run test:package
      - name: Preserve tested npm release artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

