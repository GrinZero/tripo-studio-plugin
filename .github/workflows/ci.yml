name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
      release_tag:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Package on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HUSKY: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - name: Lint and check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm run lint && pnpm run format:check
      - name: Check pull request commit messages
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Check pushed commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - run: pnpm run check:distribution
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'release' && github.event.release.tag_name) || '' }}
      - run: pnpm run build
      - name: Test cross-platform startup and input snapshots
        run: node --test test/bootstrap.test.mjs test/snapshots.test.mjs
      - name: Test operations and MCP
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm test
      - name: Test tarball with fresh npx and offline cached startup
        run: pnpm run test:package
      - name: Preserve tested npm release artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
